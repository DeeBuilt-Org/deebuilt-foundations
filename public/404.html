<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DeeBuilt</title>
    <script>
      // GitHub Pages SPA redirect shim.
      // Encodes the requested path into a query string and bounces to /,
      // where a snippet in index.html restores it via history.replaceState.
      (function () {
        var l = window.location;
        l.replace(
          l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
            "/?p=" + encodeURIComponent(l.pathname + l.search) + l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
