name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # node-version is the Node our BUILD runs on (kept at 20, works fine).
          # The @v5 action bumps above pin actions to the Node 24 runtime that
          # GitHub requires from June 2026 — a separate concern from this value.
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # This is a standalone repo that serves at the ROOT of its own domain
        # (deebuilt.co), not a subpath, so the base path stays "/" (the
        # default). Do NOT set VITE_BASE to the repo name — that would break
        # every asset URL. The CNAME lives in public/ and is copied into the
        # build output: this repo owns its custom domain directly (there is no
        # separate apex / org landing-page repo in this organization).
        run: npm run build

      - name: Add SPA fallback and disable Jekyll
        # TanStack Start prerenders /, /about, /portfolio to real HTML, but we
        # also copy the homepage to 404.html as a safety net so any unknown
        # path is handed to the client-side router instead of a hard 404.
        # .nojekyll stops Pages from ignoring files/folders that start with an
        # underscore (e.g. asset chunks).
        run: |
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          # TanStack Start emits the static site under dist/client (the
          # dist/server folder is the SSR bundle we don't deploy).
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
